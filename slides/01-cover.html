<!DOCTYPE html>
<html lang="zh-Hant" data-theme-default="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<title>01 · AI Fluency 封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body { background: #14110e; }

  .bg {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(20,17,14,0.88) 0%, rgba(20,17,14,0.42) 46%, rgba(20,17,14,0.18) 100%),
      url("../assets/cover-studio-dusk.png") center / cover no-repeat;
  }

  html[data-theme="light"] .bg {
    background:
      linear-gradient(90deg, rgba(243,239,230,0.92) 0%, rgba(243,239,230,0.55) 48%, rgba(243,239,230,0.22) 100%),
      url("../assets/cover-studio-dusk.png") center / cover no-repeat;
  }

  .rebate {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 28px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 46px,
      var(--accent) 46px 50px
    );
    opacity: 0.55;
  }

  .kicker {
    position: absolute;
    top: 44px;
    left: 72px;
    font-size: 18px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hero {
    position: absolute;
    left: 72px;
    right: 120px;
    bottom: 168px;
    max-width: 1280px;
  }

  .eyebrow {
    font-size: 22px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 22px;
  }

  h1 {
    font-family: Fraunces, "Noto Serif TC", serif;
    font-weight: 400;
    font-size: 156px;
    line-height: 0.94;
    letter-spacing: -0.04em;
    padding-top: 8px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    margin-top: 30px;
    font-size: 42px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--ink);
  }

  .subtitle .accent {
    color: var(--accent);
  }

  .lede {
    margin-top: 36px;
    max-width: 820px;
    font-size: 34px;
    line-height: 1.45;
    color: var(--muted);
    font-weight: 400;
  }

  .meta {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 44px;
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.4fr;
    gap: 24px;
    border-top: 1px solid var(--line);
    padding-top: 22px;
    font-size: 20px;
    color: var(--muted);
  }

  .meta small {
    display: block;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 8px;
  }

  .meta .value {
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="rebate" aria-hidden="true"></div>
  <div class="kicker">01 · Cover</div>

  <div class="hero">
    <p class="eyebrow">Train-the-trainer · 45 min</p>
    <h1 class="font-display">AI <em>Fluency</em></h1>
    <p class="subtitle">學會與 AI 合作的思維與方法：<br/>從使用者進化成 <span class="accent">AI 協作者</span></p>
    <p class="lede">AI流暢度 框架與基礎。
	<br/>給資訊學系培訓師的現場分享課程
	<br/>——學會委派、描述、辨別與審慎。
	<br/></p>
  </div>

  <div class="meta">
    <div>
      <small>Instructor</small>
      <div class="value">黃建豪</div>
    </div>
    <div>
      <small>Date</small>
      <div class="value">2026.09.03</div>
    </div>
    <div>
      <small>Source</small>
      <div class="value">Rick Dakan · Joseph Feller · Anthropic · CC BY-NC-SA 4.0</div>
    </div>
  </div>
  <script src="../shared/theme.js"></script>
</body>
</html>
