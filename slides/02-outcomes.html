<!DOCTYPE html>
<html lang="zh-Hant" data-theme-default="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<title>02 · 今天結束時你能做到什麼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/layout.css">
<style>
  .bays.n3 .mark { font-size: 46px; }
  .claim { margin-top: 14px; font-size: 30px; line-height: 1.4; font-weight: 500; color: var(--ink); }
</style>
</head>
<body class="slide">
  <div class="masthead">
    <span>AI Fluency · Opening</span>
    <span class="right">02 · Outcomes</span>
  </div>
  <div class="intro">
    <h1 class="font-display">這堂課下課後，你能<span>做到三件事——</span></h1>
  </div>
  <div class="stage">
    <div class="bays n3">
      <article class="bay">
        <div class="mark">01</div>
        <div class="en">Delegation</div>
        <div class="zh">委派</div>
        <div class="claim">知人善任，正確有效分派任務</div>
        <p class="blurb">知道工作任務可以給人做、讓AI 做、一起做，並能夠說出為什麼這樣分工。</p>
      </article>
      <article class="bay">
        <div class="mark">02</div>
        <div class="en">Description</div>
        <div class="zh">描述</div>
        <div class="claim">寫出讓 AI 產出更正確、更高效的提示詞</div>
        <p class="blurb">把一句模糊指令，改成同時含產出、作法、協作態度。</p>
      </article>
      <article class="bay">
        <div class="mark">03</div>
        <div class="en">Discernment</div>
        <div class="zh">辨別</div>
        <div class="claim">有能力判斷 AI 產出的品質與正確與否</div>
        <p class="blurb">能指出AI出問題的點，並知道原因、選對修正方法。</p>
      </article>
    </div>
  </div>
  <div class="page-footer">
    <span><strong>AI Fluency</strong> · 給資訊培訓師</span>
    <span>02 / 22</span>
  </div>
  <script src="../shared/theme.js"></script>
</body>
</html>
