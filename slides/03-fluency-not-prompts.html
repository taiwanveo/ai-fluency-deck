  <div class="intro">
    <h1 class="font-display">流暢度 <span>≠</span> 會寫 prompt</h1>
    <p>具備「AI流暢度」所擁有的能力是：以有效、高效、合乎倫理且安全的方式與 AI 協作。</p>
  </div>
  <div class="stage">
    <div class="four">
      <div>
        <h2>Effective</h2>
        <p>有效。<br/>產出真的能拿去上課，不是看起來完整。</p>
      </div>
      <div>
        <h2>Efficient</h2>
        <p>高效。<br/>該自己五分鐘做完的，不要花十五分鐘教它。</p>
      </div>
      <div>
        <h2>Ethical</h2>
        <p>合乎倫理。<br/>學員資料、出處、偏見，都在你的判斷裡。</p>
      </div>
      <div>
        <h2>Safe</h2>
        <p>安全。<br/>上課堂的內容由你背書；錯了不能推給模型。</p>
      </div>
    </div>
  </div>
