<!DOCTYPE html>
<html lang="zh-Hant" data-theme-default="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<title>07 · 把一場內訓拆開</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/layout.css">
<style>
  .matrix { display: grid; grid-template-columns: 280px 1fr 1fr; height: 100%; border-top: 1px solid var(--line); }
  .cell { padding: 20px 26px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 28px; line-height: 1.4; min-width: 0; }
  .cell:nth-child(3n) { border-right: 0; }
  .hd { font-family: Fraunces, serif; font-size: 30px; color: var(--accent); letter-spacing: 0.04em; }
  .task { font-weight: 500; }
</style>
</head>
<body class="slide">
  <div class="masthead">
    <span>AI Fluency · Delegation</span>
    <span class="right">07 · Worked example</span>
  </div>

  <div class="intro">
    <h1 class="font-display">把一場企業內訓<span>拆開</span></h1>
    <p>與 AI 一同規劃課程內容。先切出兩欄：哪些你留著，哪些可以交出去。<br/>中間那條界線，就是共創發生的地方。</p>
  </div>
  <div class="stage">
    <div class="matrix">
      <div class="cell hd">任務</div>
      <div class="cell hd">人留下</div>
      <div class="cell hd">可交給 AI</div>

      <div class="cell task">學習目標</div>
      <div class="cell">這一班真正要帶走什麼，你定。</div>
      <div class="cell">把草稿改寫成可觀察行為句。</div>

      <div class="cell task">活動設計</div>
      <div class="cell">教室節奏、分組、收斂方式。</div>
      <div class="cell">列出 6 個候選練習讓你挑。</div>

      <div class="cell task">教材與例子</div>
      <div class="cell">真實失敗案例、內部用語。</div>
      <div class="cell">把長文壓成投影片要點。</div>

      <div class="cell task">現場與成績</div>
      <div class="cell">臨場判斷、評分、個別回饋。</div>
      <div class="cell">課後 FAQ 草稿、延伸閱讀清單。</div>
    </div>
  </div>
  <div class="page-footer">
    <span><strong>AI Fluency</strong> · 給資訊培訓師</span>
    <span>07 / 22</span>
  </div>
  <script src="../shared/theme.js"></script>
</body>
</html>
