<body class="slide">
  <div class="masthead">
    <span>AI Fluency · Machine</span>
    <span class="right">09 · Hallucination</span>
  </div>

  <div class="intro">
    <h1 class="font-display">虛構集中在<span>特定性</span></h1>
    <p>讓它流暢的機制，正是讓它虛構的機制。主張越精確，越需要驗證。</p>
  </div>
  <div class="stage">
    <div class="bays n4" style="grid-template-columns: repeat(5, 1fr);">
      <article class="bay">
        <div class="mark">01</div>
        <div class="en">姓名</div>
        <p class="blurb">作者、學者、內部窗口，看起來很像真的人。</p>
      </article>
      <article class="bay">
        <div class="mark">02</div>
        <div class="en">日期</div>
        <p class="blurb">法規生效日、版本號、課程時數，最容易過時。</p>
      </article>
      <article class="bay">
        <div class="mark">03</div>
        <div class="en">統計</div>
        <p class="blurb">「準確度下降超過 30%」這類數字，上課前要核來源。</p>
      </article>
      <article class="bay">
        <div class="mark">04</div>
        <div class="en">引用</div>
        <p class="blurb">論文、URL、書名頁碼。編得越完整越危險。</p>
      </article>
      <article class="bay">
        <div class="mark">05</div>
        <div class="en">引言</div>
        <p class="blurb">名人金句、學員證詞。沒出處就當尚未發生。</p>
      </article>
