<body class="slide">
  <div class="masthead">
    <span>AI Fluency · Loop</span>
    <span class="right">14 · Iterate</span>
  </div>

  <div class="intro">
    <h1 class="font-display">描述 → 辨別 → <span>再描述</span></h1>
    <p>一次到位是例外。每項任務跑一輪。最後一步是你做決定、你負責。</p>
  </div>
  <div class="stage">
    <div class="steps">
      <article class="step">
        <div class="num">01</div>
        <div class="en">描述</div>
        <p class="blurb">同時說產出、過程、表現。<br/><br/>執行前先規劃這三軸，謀定而後動。</p>
      </article>
      <article class="step">
        <div class="num">02</div>
        <div class="en">辨別</div>
        <p class="blurb">對產出、過程、互動各看一眼。<br/><br/>你的專業能力、判斷力仍是關鍵。</p>
      </article>
      <article class="step">
        <div class="num">03</div>
        <div class="en">調整</div>
        <p class="blurb">具體回饋有效與無效之處。<br/><br/>改描述，而不是只說「再試一次」。</p>
      </article>
      <article class="step">
        <div class="num">04</div>
        <div class="en">整合</div>
        <p class="blurb">加入你的判斷，決定該保留、修改或是捨棄。<br/><br/>對最終輸出負責——這步接到審慎。</p>
      </article>
    </div>
  </div>
  <div class="page-footer">
    <span><strong>AI Fluency</strong> · 給資訊培訓師</span>
    <span>14 / 22</span>
  </div>
