<!DOCTYPE html>
<html lang="zh-Hant" data-theme-default="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<title>17 · Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body { background: #14110e; }
  .bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(20,17,14,0.88) 0%, rgba(20,17,14,0.45) 55%, rgba(20,17,14,0.2) 100%),
      url("../assets/cover-studio-dusk.png") center / cover no-repeat;
  }
  html[data-theme="light"] .bg {
    background:
      linear-gradient(90deg, rgba(243,239,230,0.92) 0%, rgba(243,239,230,0.55) 55%, rgba(243,239,230,0.22) 100%),
      url("../assets/cover-studio-dusk.png") center / cover no-repeat;
  }
  .rebate {
    position: absolute; top: 0; bottom: 0; left: 0; width: 28px;
    background: repeating-linear-gradient(to bottom, transparent 0 46px, var(--accent) 46px 50px);
    opacity: 0.55;
  }
  .kicker {
    position: absolute; top: 44px; left: 72px;
    font-size: 18px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted);
  }
  .hero { position: absolute; left: 72px; right: 120px; bottom: 200px; max-width: 1400px; }
  .eyebrow { font-size: 22px; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 18px; }
  h1 {
    font-family: Fraunces, "Noto Serif TC", serif;
    font-weight: 400; font-size: 148px; line-height: 0.9; letter-spacing: -0.04em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .prompts {
    margin-top: 28px; font-size: 30px; line-height: 1.5; color: var(--muted); max-width: 1080px;
  }
  .meta {
    position: absolute; left: 72px; right: 72px; bottom: 44px;
    display: grid; grid-template-columns: 1.2fr 1fr 1.4fr; gap: 24px;
    border-top: 1px solid var(--line); padding-top: 22px; font-size: 20px; color: var(--muted);
  }
  .meta small {
    display: block; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 8px;
  }
  .meta .value { color: var(--ink); }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="rebate" aria-hidden="true"></div>
  <div class="kicker">17 / 17 · Close</div>
  <div class="hero">
    <p class="eyebrow">....</p>
    <h1 class="font-display">Better Questions, <br><em>Better AI</em></h1>
    <p class="prompts">你會委派什麼任務給 AI？你會保留什麼工作給自己？<br>如果結果不理想，你會怎麼重新描述需求？<br>如果 AI 給了你一個漂亮答案，你第一個想驗證的是什麼？<br>最後一步永遠是你決定，你負責。</p>
  </div>
  <div class="meta">
    <div>
      <small>Instructor</small>
      <div class="value">黃建豪</div>
    </div>
    <div>
      <small>Coauthor</small>
      <div class="value">AI Agents</div>
    </div>
    <div>
      <small>Source</small>
      <div class="value">Rick Dakan · Joseph Feller · Anthropic · CC BY-NC-SA 4.0</div>
    </div>
  </div>
  <script src="../shared/theme.js"></script>
</body>
</html>
